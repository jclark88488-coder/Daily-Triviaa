<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Trivia 95</title>
<style>
:root{font-family:Tahoma,'MS Sans Serif',Arial,sans-serif;color:#111;background:transparent;font-size:14px}*{box-sizing:border-box}body{margin:0;padding:8px}.window{max-width:650px;margin:auto;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px #000;padding:3px}.titlebar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:4px 5px;font-weight:bold;letter-spacing:.1px}.titlebar span{white-space:nowrap}.winbtn{width:22px;height:20px;padding:0;line-height:16px}.menubar{padding:7px 5px;border-bottom:1px solid #888}.content{padding:10px}.terminal{background:#071a12;color:#8bffa7;border:2px inset #777;padding:12px;min-height:155px;font-family:'Courier New',monospace}.meta{font-size:12px;opacity:.85;margin-bottom:12px}.question{font-size:clamp(16px,3.4vw,22px);line-height:1.3;font-weight:bold}.answers{display:grid;gap:8px;margin:12px 0}.answer{width:100%;text-align:left;font-size:14px;padding:9px;min-height:40px}.answer.correct{background:#b9edbb}.answer.wrong{background:#ffd2d2}.answer:disabled{color:#111}.controls{display:flex;flex-wrap:wrap;gap:7px}.button,button{font-family:inherit;background:#c0c0c0;color:#111;border:2px solid;border-color:#fff #555 #555 #fff;box-shadow:1px 1px #111;cursor:pointer}.button:active,button:active{border-color:#555 #fff #fff #555;box-shadow:none}.controls button{padding:7px 10px}.status{border:2px inset #fff;background:#e2e2e2;padding:5px 7px;margin-top:10px;min-height:30px}.foot{display:flex;justify-content:space-between;gap:8px;margin:5px 2px;font-size:11px}.sr-only{position:absolute;left:-9999px}@media(max-width:400px){body{padding:3px}.content{padding:6px}.terminal{padding:8px}.foot{flex-direction:column}}
</style>
</head>
<body>
<main class="window" aria-label="Daily Trivia 95">
 <header class="titlebar"><span>💾 DAILY TRIVIA 95.EXE</span><button class="winbtn" id="about" title="About">?</button></header>
 <div class="menubar">File&nbsp;&nbsp; Edit&nbsp;&nbsp; <u>Q</u>uiz&nbsp;&nbsp; Help</div>
 <div class="content">
  <section class="terminal"><div class="meta" id="date"></div><div class="question" id="question"></div></section>
  <div class="answers" id="answers" role="group" aria-label="Answer choices"></div>
  <div class="controls"><button id="reveal">🔎 Reveal Answer</button><button id="next">▶ Next Question</button><button id="today">↩ Today's Question</button></div>
  <div class="status" id="status" role="status" aria-live="polite">Choose an answer or reveal it together!</div>
  <div class="foot"><span id="count"></span><span>© Classroom Trivia Lab · Offline ready</span></div>
 </div>
</main>
<script>
'use strict';
// Edit or add questions here. answer is the ZERO-BASED position of the correct choice.
const QUESTIONS = [
 {category:'Science',q:'What do plants absorb from the air to help make their food?',choices:['Oxygen','Carbon dioxide','Helium'],answer:1,why:'Plants take in carbon dioxide during photosynthesis.'},
 {category:'Geography',q:'Which ocean is the largest on Earth?',choices:['Atlantic Ocean','Indian Ocean','Pacific Ocean'],answer:2,why:'The Pacific Ocean covers more area than any other ocean.'},
 {category:'Animals',q:'What is a baby frog called?',choices:['Tadpole','Calf','Chick'],answer:0,why:'A tadpole grows and changes into an adult frog.'},
 {category:'Math',q:'How many sides does a hexagon have?',choices:['Five','Six','Eight'],answer:1,why:'Hexa- means six, so a hexagon has six sides.'},
 {category:'Space',q:'Which planet is known as the Red Planet?',choices:['Mars','Venus','Neptune'],answer:0,why:'Iron-rich dust gives Mars its reddish appearance.'},
 {category:'Science',q:'Which state of matter has a definite volume but takes the shape of its container?',choices:['Solid','Liquid','Gas'],answer:1,why:'Liquids flow to take the shape of the container while keeping nearly the same volume.'},
 {category:'Geography',q:'On which continent is Egypt?',choices:['Asia','Africa','Europe'],answer:1,why:'Most of Egypt is in northeastern Africa.'},
 {category:'Animals',q:'How many legs does an insect have?',choices:['Six','Eight','Ten'],answer:0,why:'Adult insects have three pairs of legs.'},
 {category:'History',q:'What did people use to write on before pencils were invented?',choices:['Quills','Televisions','Calculators'],answer:0,why:'People once used feather quills dipped in ink.'},
 {category:'Math',q:'What is 7 × 8?',choices:['54','56','64'],answer:1,why:'Seven groups of eight make 56.'},
 {category:'Space',q:'What is the name of Earth’s natural satellite?',choices:['The Sun','The Moon','Mars'],answer:1,why:'The Moon is Earth’s only natural satellite.'},
 {category:'Science',q:'What force pulls objects toward Earth?',choices:['Magnetism','Friction','Gravity'],answer:2,why:'Gravity attracts objects with mass toward each other.'},
 {category:'Geography',q:'Which direction is opposite east?',choices:['West','North','South'],answer:0,why:'East and west are opposite compass directions.'},
 {category:'Animals',q:'Which animal is a mammal?',choices:['Shark','Dolphin','Trout'],answer:1,why:'Dolphins breathe air and feed milk to their young.'},
 {category:'Math',q:'How many minutes are in one hour?',choices:['30','60','100'],answer:1,why:'One hour equals 60 minutes.'},
 {category:'Science',q:'At what temperature does pure water freeze in Celsius?',choices:['0°C','50°C','100°C'],answer:0,why:'At normal atmospheric pressure, pure water freezes at 0°C.'},
 {category:'Geography',q:'What is the capital of Massachusetts?',choices:['Springfield','Boston','Worcester'],answer:1,why:'Boston is the capital of Massachusetts.'},
 {category:'Animals',q:'What do bees collect from flowers to make honey?',choices:['Nectar','Sand','Leaves'],answer:0,why:'Honeybees collect nectar and transform it into honey.'},
 {category:'History',q:'What invention made it easier to print many books?',choices:['Printing press','Telescope','Compass'],answer:0,why:'Printing presses helped people produce books much faster.'},
 {category:'Math',q:'What fraction is the same as one half?',choices:['2/4','1/3','3/4'],answer:0,why:'Two out of four equal parts is the same amount as one half.'},
 {category:'Space',q:'Which star is closest to Earth?',choices:['Polaris','The Sun','Sirius'],answer:1,why:'Our Sun is the closest star to Earth.'},
 {category:'Science',q:'What part of the body pumps blood?',choices:['Lungs','Stomach','Heart'],answer:2,why:'The heart pumps blood throughout the body.'},
 {category:'Geography',q:'Which continent is the South Pole on?',choices:['Antarctica','Australia','South America'],answer:0,why:'The geographic South Pole is on Antarctica.'},
 {category:'Animals',q:'Which of these animals lays eggs?',choices:['Cat','Chicken','Dog'],answer:1,why:'Chickens are birds, and birds lay eggs.'},
 {category:'Math',q:'What is the perimeter of a square with 4-inch sides?',choices:['8 inches','12 inches','16 inches'],answer:2,why:'Add all four sides: 4 + 4 + 4 + 4 = 16 inches.'},
 {category:'Science',q:'Which tool measures temperature?',choices:['Thermometer','Ruler','Compass'],answer:0,why:'A thermometer measures temperature.'},
 {category:'Geography',q:'How many continents are usually taught in the seven-continent model?',choices:['Five','Six','Seven'],answer:2,why:'The seven-continent model names Asia, Africa, North America, South America, Antarctica, Europe, and Australia.'},
 {category:'Animals',q:'What do caterpillars turn into?',choices:['Butterflies or moths','Frogs','Spiders'],answer:0,why:'Caterpillars are the larval stage of butterflies and moths.'},
 {category:'History',q:'What is a primary source?',choices:['A firsthand record','A fictional story','A modern summary'],answer:0,why:'A primary source comes from someone or something directly connected to the event.'},
 {category:'Math',q:'What is 100 minus 37?',choices:['73','63','67'],answer:1,why:'100 − 37 = 63.'},
 {category:'Space',q:'Which planet has a famous system of bright rings?',choices:['Mercury','Saturn','Venus'],answer:1,why:'Saturn has a spectacular ring system made mostly of ice particles.'},
 {category:'Science',q:'What is the process called when liquid water becomes water vapor?',choices:['Freezing','Evaporation','Melting'],answer:1,why:'Evaporation changes liquid water into gas.'},
 {category:'Geography',q:'Which imaginary line divides Earth into Northern and Southern Hemispheres?',choices:['Equator','Prime Meridian','Tropic of Cancer'],answer:0,why:'The Equator lies halfway between the North and South Poles.'},
 {category:'Animals',q:'Which bird cannot fly?',choices:['Eagle','Penguin','Sparrow'],answer:1,why:'Penguins use their wings as flippers to swim.'},
 {category:'Math',q:'What is 9 × 6?',choices:['45','54','63'],answer:1,why:'Nine groups of six make 54.'},
 {category:'Science',q:'Which part of a plant usually takes in water from the soil?',choices:['Roots','Flowers','Petals'],answer:0,why:'Roots absorb water and minerals from the soil.'},
 {category:'Geography',q:'What do the blue areas on most maps represent?',choices:['Mountains','Water','Roads'],answer:1,why:'Blue is commonly used for oceans, lakes, and rivers.'},
 {category:'Animals',q:'Which animal is known for changing color to blend in?',choices:['Chameleon','Giraffe','Elephant'],answer:0,why:'Some chameleons change color for communication and temperature regulation, as well as camouflage.'},
 {category:'History',q:'What do archaeologists study?',choices:['Ancient objects and sites','Weather forecasts','Planet orbits'],answer:0,why:'Archaeologists learn about past people by studying material remains.'},
 {category:'Math',q:'How many centimeters are in one meter?',choices:['10','100','1,000'],answer:1,why:'One meter equals 100 centimeters.'}
];
const $=id=>document.getElementById(id);
// A fixed epoch and local calendar date give everyone in the same time zone the same daily question.
const epoch=Date.UTC(2026,0,1);const now=new Date();const todayNumber=Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-epoch)/86400000);
const dailyIndex=((todayNumber%QUESTIONS.length)+QUESTIONS.length)%QUESTIONS.length;
let index=dailyIndex,answered=false;
function render(){const item=QUESTIONS[index];answered=false;$('date').textContent=`C:\\TRIVIA> ${now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}  |  ${item.category.toUpperCase()}`;$('question').textContent=item.q;$('answers').replaceChildren();item.choices.forEach((choice,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=`${String.fromCharCode(65+i)}. ${choice}`;b.addEventListener('click',()=>select(i));$('answers').append(b)});$('status').textContent='Choose an answer or reveal it together!';$('count').textContent=`QUESTION ${index+1} OF ${QUESTIONS.length}${index===dailyIndex?' · DAILY PICK':''}`;}
function select(chosen){if(answered)return;answered=true;const item=QUESTIONS[index];[...$('answers').children].forEach((b,i)=>{b.disabled=true;if(i===item.answer)b.classList.add('correct');else if(i===chosen)b.classList.add('wrong')});$('status').textContent=(chosen===item.answer?'✓ CORRECT! ':'✗ GOOD TRY! ')+item.why;}
$('reveal').addEventListener('click',()=>select(-1));$('next').addEventListener('click',()=>{index=(index+1)%QUESTIONS.length;render()});$('today').addEventListener('click',()=>{index=dailyIndex;render()});$('about').addEventListener('click',()=>alert('Daily Trivia 95 — 40 classroom-friendly questions. A new daily pick appears each day. No login, tracking, or internet required after loading.'));
render();
</script>
</body></html>
